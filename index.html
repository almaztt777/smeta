<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Смета за 5 минут</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <header><p class="eyebrow">ПРОСТО • БЫСТРО • БЕЗ РЕГИСТРАЦИИ</p><h1>Смета за 5 минут</h1><p>Подготовьте смету для вашего клиента.</p></header>
    <section class="card" aria-labelledby="details-heading">
      <h2 id="details-heading">Реквизиты</h2>
      <div class="grid">
        <label>От кого<textarea id="sender" rows="3" placeholder="Имя или компания, контакты"></textarea></label>
        <label>Для кого<textarea id="recipient" rows="3" placeholder="Клиент или компания"></textarea></label>
        <label>Номер сметы<input id="number" value="1"></label>
        <label>Дата<input id="date" type="date"></label>
      </div>
    </section>
    <section class="card" aria-labelledby="items-heading">
      <h2 id="items-heading">Позиции сметы</h2>
      <table><thead><tr><th>Название</th><th>Количество</th><th>Единица</th><th>Цена</th><th>Сумма</th><th><span class="sr-only">Действия</span></th></tr></thead><tbody id="items"></tbody></table>
      <button id="add" type="button">+ Добавить позицию</button>
    </section>
    <section class="card totals" aria-label="Итоги">
      <div class="grid adjustments">
        <label>Валюта<select id="currency"><option>₸</option><option>₽</option><option>$</option><option>€</option></select></label>
        <label>Скидка, %<input id="discount" inputmode="decimal" value="0"></label>
        <label>НДС после скидки, %<input id="vat" inputmode="decimal" value="0"></label>
      </div>
      <p class="summary-line">Сумма позиций <output id="subtotal"></output></p>
      <p class="summary-line" id="discount-line" hidden><span id="discount-label">Скидка</span><output id="discount-amount"></output></p>
      <p class="summary-line" id="vat-line" hidden><span id="vat-label">НДС</span><output id="vat-amount"></output></p>
      <p class="grand-total">Итого <output id="total" aria-live="polite">0 ₸</output></p>
    </section>
  </main>
</body>
</html>
